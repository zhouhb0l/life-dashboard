<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Daily Plan Detail</title>
  <style>
    :root {
      --bg: #f7f8f4;
      --surface: #ffffff;
      --surface-2: #f0f4f1;
      --ink: #18211f;
      --muted: #68736f;
      --line: #d9e0dc;
      --green: #2f7d5c;
      --blue: #336fa6;
      --shadow: 0 16px 42px rgba(29, 45, 39, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Aptos", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    body.locked .shell {
      display: none;
    }

    body:not(.locked) .vault {
      display: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 20px 0 42px;
      display: grid;
      gap: 14px;
    }

    .vault {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .vault-panel {
      width: min(440px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: 22px;
      display: grid;
      gap: 14px;
    }

    .vault-panel h1,
    .vault-panel p {
      margin: 0;
    }

    .vault-panel h1 {
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .vault-panel p {
      color: var(--muted);
      line-height: 1.5;
    }

    .vault-form {
      display: grid;
      gap: 10px;
    }

    .vault-form label {
      font-weight: 800;
      color: var(--muted);
      font-size: 13px;
    }

    .vault-form input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 11px;
      outline: 0;
      background: white;
      color: var(--ink);
    }

    .vault-form input:focus {
      border-color: rgba(47, 125, 92, 0.6);
      box-shadow: 0 0 0 4px rgba(47, 125, 92, 0.1);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
    }

    .remember-row input {
      width: auto;
    }

    .vault-error {
      min-height: 20px;
      color: #b65454;
      font-weight: 800;
      font-size: 13px;
    }

    .topbar,
    .panel {
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .topbar {
      background: #1f2b28;
      color: #f9fbf8;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .topbar h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back,
    .lock-button,
    .unlock-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 800;
    }

    .back,
    .lock-button {
      background: rgba(255, 255, 255, 0.12);
      color: #f9fbf8;
    }

    .unlock-button {
      background: var(--green);
      color: white;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 16px;
      display: grid;
      gap: 16px;
    }

    .detail-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    h2,
    h3,
    p {
      margin: 0;
    }

    h2 {
      font-size: 24px;
      letter-spacing: 0;
    }

    .hint,
    .summary {
      color: var(--muted);
      line-height: 1.5;
    }

    .summary {
      color: #34413d;
    }

    .percent {
      font-size: 30px;
      font-weight: 900;
      color: var(--green);
      white-space: nowrap;
    }

    .bar {
      height: 12px;
      border-radius: 999px;
      background: #dfe7e2;
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      width: var(--value);
      background: linear-gradient(90deg, var(--green), var(--blue));
    }

    .info-grid,
    .columns {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .columns {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .info,
    .block {
      border: 1px solid var(--line);
      background: #fbfcfa;
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }

    .info {
      display: grid;
      gap: 5px;
    }

    .info span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .info strong {
      font-size: 17px;
      line-height: 1.2;
    }

    .block h3 {
      font-size: 15px;
      margin-bottom: 8px;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    li {
      color: #34413d;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .timeline li {
      border-left: 3px solid rgba(47, 125, 92, 0.35);
      padding-left: 10px;
    }

    .project-link {
      color: var(--blue);
      font-weight: 800;
    }

    .title-line {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category-label {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 900;
      line-height: 1;
      background: var(--surface-2);
      color: var(--muted);
      white-space: nowrap;
    }

    .category-label.research { background: rgba(51, 111, 166, 0.12); color: var(--blue); }
    .category-label.life { background: rgba(189, 118, 48, 0.13); color: #bd7630; }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 18px;
      background: #fbfcfa;
      line-height: 1.5;
    }

    @media (max-width: 800px) {
      .info-grid,
      .columns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="locked">
  <section class="vault" aria-label="Daily plan unlock">
    <div class="vault-panel">
      <h1>Daily Plan</h1>
      <p>This detail page is encrypted. Enter the vault passphrase to decrypt it in this browser.</p>
      <form class="vault-form" id="vaultForm">
        <label for="vaultPassphrase">Passphrase</label>
        <input id="vaultPassphrase" type="password" autocomplete="current-password" required>
        <label class="remember-row" for="rememberVault">
          <input id="rememberVault" type="checkbox" checked>
          Remember on this device
        </label>
        <button class="unlock-button" id="vaultSubmit" type="submit">Unlock</button>
      </form>
      <div class="vault-error" id="vaultError" role="status" aria-live="polite"></div>
    </div>
  </section>
  <main class="shell">
    <header class="topbar">
      <h1 id="pageTitle">Daily Plan Detail</h1>
      <div class="top-actions">
        <a class="back" href="index.html">Back To Index</a>
        <button class="lock-button" id="lockVaultButton" type="button">Lock</button>
      </div>
    </header>
    <section class="panel" id="detail"></section>
  </main>

  <script src="encrypted-data.js"></script>
  <script src="crypto.js"></script>
  <script src="db.js"></script>
  <script>
    const REMEMBERED_PASSPHRASE_KEY = "daily-plan.remembered-passphrase.v1";

    let DEFAULT_DATA = null;

    let state = { dataVersion: 0, days: [], projects: [] };
    let currentPassphrase = "";
    const detail = document.getElementById("detail");
    const pageTitle = document.getElementById("pageTitle");
    const vaultForm = document.getElementById("vaultForm");
    const vaultPassphrase = document.getElementById("vaultPassphrase");
    const rememberVault = document.getElementById("rememberVault");
    const vaultSubmit = document.getElementById("vaultSubmit");
    const vaultError = document.getElementById("vaultError");
    const lockVaultButton = document.getElementById("lockVaultButton");

    vaultForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      await unlockVault();
    });

    lockVaultButton.addEventListener("click", lockVault);

    async function unlockVault() {
      const passphrase = vaultPassphrase.value;
      const shouldRemember = rememberVault.checked;
      vaultSubmit.disabled = true;
      setVaultError("");

      try {
        await openVault(passphrase);
        if (shouldRemember) {
          rememberPassphrase(passphrase);
        } else {
          forgetPassphrase();
        }
      } catch (error) {
        currentPassphrase = "";
        DEFAULT_DATA = null;
        setVaultError(error.message);
        vaultPassphrase.select();
      } finally {
        vaultSubmit.disabled = false;
      }
    }

    async function openVault(passphrase) {
      DEFAULT_DATA = await DailyPlanCrypto.decryptEnvelope(window.DAILY_PLAN_ENCRYPTED_DATA, passphrase);
      currentPassphrase = passphrase;
      state = await loadState();
      document.body.classList.remove("locked");
      vaultPassphrase.value = "";
      renderRoute();
    }

    function lockVault() {
      currentPassphrase = "";
      DEFAULT_DATA = null;
      state = { dataVersion: 0, days: [], projects: [] };
      detail.innerHTML = "";
      pageTitle.textContent = "Daily Plan Detail";
      document.title = "Daily Plan Detail";
      document.body.classList.add("locked");
      forgetPassphrase();
      setVaultError("");
      setTimeout(() => vaultPassphrase.focus(), 0);
    }

    function setVaultError(message) {
      vaultError.textContent = message || "";
    }

    function rememberPassphrase(passphrase) {
      try {
        localStorage.setItem(REMEMBERED_PASSPHRASE_KEY, passphrase);
      } catch (error) {
        setVaultError("Unlocked, but this browser could not remember the passphrase.");
      }
    }

    function forgetPassphrase() {
      try {
        localStorage.removeItem(REMEMBERED_PASSPHRASE_KEY);
      } catch (error) {
        // Local storage cleanup is best-effort only.
      }
    }

    async function tryRememberedUnlock() {
      let passphrase = "";
      try {
        passphrase = localStorage.getItem(REMEMBERED_PASSPHRASE_KEY) || "";
      } catch (error) {
        passphrase = "";
      }

      if (!passphrase) {
        setTimeout(() => vaultPassphrase.focus(), 0);
        return;
      }

      try {
        await openVault(passphrase);
        rememberVault.checked = true;
      } catch (error) {
        forgetPassphrase();
        setVaultError("Saved passphrase no longer works. Enter it again.");
        setTimeout(() => vaultPassphrase.focus(), 0);
      }
    }

    function renderRoute() {
      const route = readRoute();

      if (route.type === "project") {
        renderProject(route.id);
      } else {
        renderDay(route.id);
      }
    }

    async function loadState() {
      return DailyPlanDB.load(DEFAULT_DATA, currentPassphrase);
    }

    function readRoute() {
      const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
      const [type, id] = raw.split(":");
      return { type, id };
    }

    function renderProject(id) {
      const project = state.projects.find((item) => item.id === id);
      if (!project) {
        pageTitle.textContent = "Project Not Found";
        detail.innerHTML = '<div class="empty">This project was not found. Return to the index and open it again.</div>';
        return;
      }

      document.title = `${project.name} - Daily Plan`;
      pageTitle.textContent = "Project Progress";
      detail.innerHTML = `
        <div class="detail-top">
          <div>
            <div class="title-line">
              <h2>${escapeHtml(project.name)}</h2>
              ${categoryLabelHtml(project)}
            </div>
            <p class="hint">Project progress history by date.</p>
          </div>
          <div class="percent">${project.progress}%</div>
        </div>
        <div class="bar" style="--value:${project.progress}%"><span></span></div>
        <div class="info-grid">
          <div class="info"><span>Start Date</span><strong>${formatDate(project.startDate)}</strong></div>
          <div class="info"><span>Current Progress</span><strong>${project.progress}%</strong></div>
          <div class="info"><span>Records</span><strong>${project.log.length}</strong></div>
          <div class="info"><span>Finished Date</span><strong>${project.finishDate ? formatDate(project.finishDate) : "Not finished"}</strong></div>
        </div>
        <div class="block">
          <h3>Progress Data</h3>
          <ul class="timeline">
            ${project.log.slice().sort((a, b) => b.date.localeCompare(a.date)).map((item) => `
              <li><strong>${formatDate(item.date)}</strong> - ${item.percent}%<br>${escapeHtml(item.note)}</li>
            `).join("")}
          </ul>
        </div>
      `;
    }

    function renderDay(id) {
      const day = state.days.find((item) => item.id === id);
      if (!day) {
        pageTitle.textContent = "Day Not Found";
        detail.innerHTML = '<div class="empty">This day was not found. Return to the index and open it again.</div>';
        return;
      }

      const dayLogs = state.projects
        .flatMap((project) => project.log
          .filter((entry) => entry.date === day.date)
          .map((entry) => ({ project: project.name, projectId: project.id, ...entry })));

      document.title = `${formatDate(day.date)} - Daily Plan`;
      pageTitle.textContent = "Daily Detail";
      detail.innerHTML = `
        <div class="detail-top">
          <div>
            <h2>${formatDate(day.date, { weekday: "long", month: "long", day: "2-digit", year: "numeric" })}</h2>
            <p class="hint">${escapeHtml(day.summary || "Daily entry")}</p>
          </div>
        </div>
        <div class="columns">
          <div class="block">
            <h3>Detailed Plans</h3>
            ${listHtml(day.plans)}
          </div>
          <div class="block">
            <h3>What I Did</h3>
            ${listHtml(day.done)}
          </div>
          <div class="block">
            <h3>Thoughts</h3>
            <p class="summary">${escapeHtml(day.thoughts || "No thoughts written yet.")}</p>
          </div>
        </div>
        <div class="block">
          <h3>Project Progress On This Day</h3>
          ${dayLogs.length ? `<ul class="timeline">${dayLogs.map((item) => `<li><a class="project-link" href="detail.html#project:${item.projectId}">${escapeHtml(item.project)}</a> - ${item.percent}%<br>${escapeHtml(item.note)}</li>`).join("")}</ul>` : '<p class="summary">No project progress has been recorded for this date.</p>'}
        </div>
      `;
    }

    function formatDate(dateString, options = { month: "short", day: "2-digit", year: "numeric" }) {
      return new Intl.DateTimeFormat("en-GB", options).format(parseIso(dateString));
    }

    function parseIso(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function listHtml(items) {
      if (!items.length) return '<p class="summary">Nothing written yet.</p>';
      return `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function categoryLabelHtml(project) {
      const category = project.category || "Research";
      return `<span class="category-label ${category.toLowerCase()}">${escapeHtml(category)}</span>`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    tryRememberedUnlock();
  </script>
</body>
</html>
