<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 720" role="img" aria-labelledby="title desc">
  <title id="title">Pristine-lattice phonon defect susceptibility motivation</title>
  <desc id="desc">A schematic showing pristine lattice response to a local defect perturbation, producing high and low susceptibility channels.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L16,9 L2,16 Z" fill="#2e6f9f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L16,9 L2,16 Z" fill="#2d7d61"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#15201c" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="heat" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1f58b5"/>
      <stop offset="0.25" stop-color="#33a8de"/>
      <stop offset="0.48" stop-color="#ffe66b"/>
      <stop offset="0.68" stop-color="#f06b2f"/>
      <stop offset="1" stop-color="#b41525"/>
    </linearGradient>
    <pattern id="gridPattern" width="70" height="52" patternUnits="userSpaceOnUse">
      <path d="M0,26 L35,0 L70,26 L35,52 Z" fill="none" stroke="#9fc2b2" stroke-width="3"/>
      <circle cx="0" cy="26" r="7" fill="#2e938b"/>
      <circle cx="35" cy="0" r="7" fill="#62a65d"/>
      <circle cx="70" cy="26" r="7" fill="#2e938b"/>
      <circle cx="35" cy="52" r="7" fill="#62a65d"/>
    </pattern>
  </defs>

  <rect width="2200" height="720" rx="36" fill="#fbfcfa"/>

  <g transform="translate(70 70)">
    <rect x="0" y="0" width="460" height="520" rx="28" fill="#ffffff" stroke="#d8e1dc" stroke-width="3" filter="url(#softShadow)"/>
    <text x="34" y="56" fill="#15201c" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">Pristine lattice</text>
    <text x="34" y="102" fill="#66736e" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">candidate material / mode</text>
    <rect x="46" y="150" width="365" height="210" rx="18" fill="url(#gridPattern)" stroke="#b9c8c0" stroke-width="3"/>
    <circle cx="240" cy="255" r="54" fill="#ff6b6b" opacity="0.22"/>
    <circle cx="240" cy="255" r="21" fill="#c04473"/>
    <path d="M240 176 C280 188 306 216 319 255 C306 294 280 322 240 334 C200 322 174 294 161 255 C174 216 200 188 240 176Z" fill="none" stroke="#c04473" stroke-width="6"/>
    <text x="50" y="430" fill="#2d7d61" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="29" font-weight="850">local perturbation <tspan font-family="Cambria Math, Times New Roman, serif" font-style="italic">V</tspan><tspan baseline-shift="sub" font-size="18">d</tspan></text>
    <text x="50" y="470" fill="#66736e" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">mass / force constants / vacancy</text>
  </g>

  <path d="M565 330 C660 330 695 330 775 330" fill="none" stroke="#2e6f9f" stroke-width="18" stroke-linecap="round" marker-end="url(#arrowBlue)" opacity="0.92"/>

  <g transform="translate(805 70)">
    <rect x="0" y="0" width="540" height="520" rx="28" fill="#ffffff" stroke="#d8e1dc" stroke-width="3" filter="url(#softShadow)"/>
    <text x="38" y="56" fill="#15201c" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">Pristine response</text>
    <text x="38" y="102" fill="#66736e" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">use <tspan font-family="Cambria Math, Times New Roman, serif" font-style="italic">G</tspan><tspan baseline-shift="sub" font-size="17">0</tspan>, no large defect cell</text>
    <rect x="86" y="170" width="370" height="150" rx="22" fill="url(#gridPattern)" stroke="#85aab9" stroke-width="4"/>
    <rect x="58" y="136" width="64" height="218" rx="14" fill="#d6d9dc" stroke="#9aa8ad" stroke-width="3"/>
    <rect x="420" y="136" width="64" height="218" rx="14" fill="#d6d9dc" stroke="#9aa8ad" stroke-width="3"/>
    <circle cx="270" cy="244" r="62" fill="#ff6b6b" opacity="0.22"/>
    <circle cx="270" cy="244" r="18" fill="#c04473"/>
    <circle cx="270" cy="244" r="116" fill="none" stroke="#98c0f4" stroke-width="6" opacity="0.48"/>
    <circle cx="270" cy="244" r="172" fill="none" stroke="#98c0f4" stroke-width="5" opacity="0.30"/>
    <text x="62" y="424" fill="#2e6f9f" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="30" font-weight="850">one-defect log-loss</text>
    <text x="62" y="464" fill="#66736e" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">response of each heat-carrying channel</text>
  </g>

  <path d="M1380 330 C1470 330 1510 330 1595 330" fill="none" stroke="#2e6f9f" stroke-width="18" stroke-linecap="round" marker-end="url(#arrowBlue)" opacity="0.92"/>

  <g transform="translate(1628 70)">
    <rect x="0" y="0" width="500" height="520" rx="28" fill="#ffffff" stroke="#d8e1dc" stroke-width="3" filter="url(#softShadow)"/>
    <text x="34" y="56" fill="#15201c" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">Susceptibility</text>
    <text x="34" y="102" fill="#66736e" font-family="Cambria Math, Times New Roman, serif" font-size="27" font-weight="700"><tspan font-style="italic">χ</tspan><tspan baseline-shift="sub" font-size="17">T</tspan>(ω,k)</text>
    <rect x="42" y="140" width="390" height="132" rx="18" fill="#fff4f4" stroke="#e6b8b8" stroke-width="3"/>
    <rect x="70" y="172" width="178" height="45" rx="8" fill="url(#heat)"/>
    <path d="M76 245 C125 206 163 276 211 230 C245 195 302 210 356 168" fill="none" stroke="#c44b4b" stroke-width="7" stroke-linecap="round"/>
    <text x="270" y="184" fill="#a84d4d" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="28" font-weight="900">high</text>
    <text x="270" y="222" fill="#a84d4d" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">defect-prone</text>
    <rect x="42" y="312" width="390" height="132" rx="18" fill="#f0f8f2" stroke="#b7d9c1" stroke-width="3"/>
    <rect x="70" y="344" width="178" height="45" rx="8" fill="#d7ebdd"/>
    <path d="M76 414 C128 402 184 397 240 396 C282 394 322 391 358 384" fill="none" stroke="#2d7d61" stroke-width="7" stroke-linecap="round"/>
    <text x="270" y="356" fill="#2d7d61" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="28" font-weight="900">low</text>
    <text x="270" y="394" fill="#2d7d61" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">defect-resilient</text>
  </g>

  <g transform="translate(530 632)">
    <path d="M0 0 H1120" stroke="#2d7d61" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
    <text x="0" y="48" fill="#15201c" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="30" font-weight="850">transferable</text>
    <text x="235" y="48" fill="#15201c" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="30" font-weight="850">scalable</text>
    <text x="410" y="48" fill="#15201c" font-family="Aptos, Segoe UI, Arial, sans-serif" font-size="30" font-weight="850">no large defect supercell for every case</text>
  </g>
</svg>
