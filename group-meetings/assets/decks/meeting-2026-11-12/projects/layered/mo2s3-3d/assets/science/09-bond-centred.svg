<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">09 bond centred</title><desc id="desc">Actual q2 bulk coordinates with the16periodic Mo-Mo pairs whose parent separation is3.2046angstrom. Eight shorten and eight lengthen. For bonds crossing a cell face, the visible lighter endpoint is the same supplied atom translated by an integer lattice vector. Solid teal and dashed orange lines identify shortened and lengthened bonds, not invented electronic orbitals. Bond labels2.95and3.46angstrom round the supplied saved ranges. The saved bonding analysis reports8of8shortened bonds gaining overlap population and8of8lengthened bonds losing overlap population. Site-charge changes are described only qualitatively as modest; no charge magnitude, atom-resolved electronic density or fabricated charge map is shown.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="290" y="30" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">Actual q₂ Mo–Mo network</text><g data-cell-translation="0,0,0" opacity="1"><line x1="220.2143" y1="370" x2="159.2005" y2="195.7643" stroke="#8fa2b4" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="220.2143" y1="370" x2="220.2143" y2="254.2357" stroke="#8fa2b4" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="220.2143" y1="370" x2="420.7995" y2="370" stroke="#8fa2b4" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="159.2005" y1="195.7643" x2="159.2005" y2="80" stroke="#8fa2b4" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="159.2005" y1="195.7643" x2="359.7857" y2="195.7643" stroke="#8fa2b4" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="220.2143" y1="254.2357" x2="159.2005" y2="80" stroke="#8fa2b4" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="220.2143" y1="254.2357" x2="420.7995" y2="254.2357" stroke="#8fa2b4" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="159.2005" y1="80" x2="359.