<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">14 thermo spectra</title><desc id="desc">Left panel evaluates the actual native c-direction first-moment integrand w1(E)=(E−EF)T_c(E)(−df/dE) at300K using every saved native point in the displayed−0.2to+0.2eV interval. The Fermi derivative uses kB in eV/K, so the plotted weight is dimensionless. Phase colors and low-opacity areas preserve its negative-below/positive-above EF sign; no smoothing or invented transmission curve is applied. The visible integrand area is a partial display window and is not asserted equal to the full saved moment. Right panel uses independent full-window saved K0andK1 values over−0.5to+0.5eV: mean energy=K1_J/(e K0) in eV, converted to meV, equivalent to−eTS for positive elementary charge. Means are parent-1.6969104581428671meV andq22.6175272381391412meV; these match the full-precision saved c-Seebeck values. Raw plotted transmission excludes spin and a common spin factor cancels in the moment ratio. Fixed saved bulk Hamiltonians and chemical potentials are retained. No K2, electronic thermal conductivity, lattice thermal conductivity or ZT is inferred.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">a  c-directed first-moment spectrum</text><line x1="95" y1="305.33333" x2="625" y2="305.33333" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="312.33333" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">-0.5</text><line x1="95" y1="226" x2="625" y2="226" stroke="#9aaab8" stroke-width="2"/><text x="83" y="233" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="95" y1="146.66667" x2="625" y2="146.66667" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="153.66667" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.5</tex