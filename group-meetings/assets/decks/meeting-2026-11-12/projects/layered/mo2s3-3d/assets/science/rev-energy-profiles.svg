<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">rev-energy-profiles</title><desc id="d">Both panels use the same signed mass-weighted collective coordinate Q40 in angstromsqrtamu, with identical horizontal−1.1to5.1 and vertical−20to2meV/f.u. limits. Its magnitude is sqrt(sum over40atoms of m_i times displacement_i squared), with no per-atom average. Masses are Mo95.96amu andS32.065amu. q1 retains all actual strict scale0,.25,.5,1 energies, converting each scale lambda toQ40=3.083645688799572lambda. PatternA is the former phase0degree seed lambdaR; PatternB is the former phase45degree seed lambda(R−I)/sqrt2, from one complex field R+iI. These are two displacement patterns selected by modulation phase, not Cartesian rotations or separately established crystal phases. The original q2 radial coordinate is alreadyQ40, preserving every saved positive/negative point and the sampled minimumQ4.375,−152.72meV/40atoms. All energies are unchanged and divided by8formulaunits. q1 remains a site-class proxy and its minimum is not bracketed. Cell shapes/orderings and parent references differ between paths; common units do not establish relaxed phase ordering. Lines only connect actual samples; no mirrored q1points, fitted curves or additional calculations are introduced. The q2 frozen curve uses Gamma3x6x4. A separate categorical inset in panelb shows static E0 differences at identical relaxation-derived q2/parent branch geometries, Gamma5x10x8:−35.88519875 and Gamma6x12x12:−36.9491525meV/f.u. Each dense pair references its matched relaxation-derived parent, not the harmonic parent used by the frozen curve. The inset points do not lie on the frozen displacement path and are not connected to it. Negative q2 ordering persists, while the 8.51163meV/40atom mesh change exceeds the saved0.5meV gate, so quantitative mesh convergence is not established.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="27" fill="#10243e" text-anchor="start" font-weight="700">a  q₁-inspired distortion</text><line x1="100" y1="340" x2="565" y2="340" stroke="#dce5ec" stroke-width="1.4"/><text x="88" y="347" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">-20</text><line x1="100" y1="287.72727272727275" x2="565" y2="287.72727272727275" stroke="#dce5ec" stroke-width="1.4"/><text x="88" y="294.72727272727275" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">-15</text><line x1="100" y1="235.45454545454544" x2="565" y2="235.45454545454544" stroke="#dce5ec" stroke-width="1.4"/><text x="88" y="242.45454545454544" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">-10</text><line x1="100" y1="183.1818181818182" x2="565" y2="183.1818181818182" stroke="#dce5ec" stroke-width="1.4"/><text x="88" y="190.1818181818182" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">-5</text><line x1="100" y1="130.9090909090909" x2="565" y2="130.9090909090909" stroke="#dce5ec" stroke-width="1.4"/><text x="88" y="137.9090909090909" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="107.50000000000001" y1="340" x2="107.50000000000001" y2="346" stroke="#60728a" stroke-width="1.4"/><text x="107.50000000000001" y="372" font-size="23" fill="#60728a" text-anchor="middle" font-weight="400">-1</text><line x1="182.5" y1="340" x2="182.5" y2="346" stroke="#60728a" stroke-width="1.4"/><text x="182.5" y="372" font-size="23" fill="#60728a" text-anchor="middle" font-weight="400">0</text><line x1="257.5" y1="340" x2="257.5" y2="346" stroke="#60728a" stroke-width="1.4"/><text x="257.5" y="372" font-size="23" fill="#60728a" text-anchor="middle" font-weight="400">1</text><line x1="332.50000000000006" y1="340" x2="332.50000000000006" y2="346" stroke="#60728a" stroke-width="1.4"/><text x="332.50000000000006" y="372" font-size="23" fill="#60728a" text-anchor="middle" font-weight="400">2<