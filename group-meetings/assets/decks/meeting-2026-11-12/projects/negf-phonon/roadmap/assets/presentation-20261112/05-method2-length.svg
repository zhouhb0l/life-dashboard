<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">05-reference-seeded-scba-length</title><desc id="desc">The Reference-seeded SCBA conductances retain all three original values. Lengths are the actual interacting-region lengths0.543356003,1.630068009,2.716780015nm and correspond to1,3,5layers. The conductance panel is linear in actual length. Thermal resistance is exactly R=1/G, with G in nW/K and R in K/nW; no conductivity or resistivity is substituted. Each dashed line is an unweighted ordinary-least-squares affine fit R=a+bL to the last three resistance samples of that method. These short series contain only three points, so all three points enter each fit; the line is drawn across their sampled interval. The affine form is a descriptive Fourier-form comparison, not an independently validated bulk Fourier limit. No same-method periodic microscopic bulk conductivity is supplied for these short devices. The fitted lines retain visible residuals and do not establish diffusion. Harmonic-reduction values remain in the slide text and source dataset.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="27" fill="#10243e" text-anchor="start" font-weight="700">a  Conductance</text><line x1="100" y1="330" x2="570" y2="330" stroke="#dce5ec" stroke-width="1.4" opacity="1"/><text x="88" y="337" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.27</text><line x1="100" y1="285.6" x2="570" y2="285.6" stroke="#dce5ec" stroke-width="1.4" opacity="1"/><text x="88" y="292.6" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.28</text><line x1="100" y1="241.2" x2="570" y2="241.2" stroke="#dce5ec" stroke-width="1.4" opacity="1"/><text x="88" y="248.2" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.29</text><line x1="100" y1="196.8" x2="570" y2="196.8" stroke="#dce5ec" stroke-width="1.4" 