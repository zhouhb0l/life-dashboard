<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">07-moment-results</title><desc id="d">Qualified original4x4 saved-reference higher moments give kappa0=169.45059900671365W/mK andell4=5132.335933559581nm. ell4=a sqrt(mu4/(12mu2)). It describes the real long-wavelength expansion, not a measured mean free path or a contacted-device crossover length.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="285" y="55" font-size="29" fill="#10243e" text-anchor="middle" font-weight="700">Finite bulk coefficient</text><text x="915" y="55" font-size="29" fill="#10243e" text-anchor="middle" font-weight="700">Large response scale</text><text x="285" y="195" font-size="68" fill="#0f8b8d" text-anchor="middle" font-weight="700">169.45</text><text x="285" y="245" font-size="29" fill="#0f8b8d" text-anchor="middle" font-weight="400">W m⁻¹ K⁻¹</text><text x="915" y="195" font-size="68" fill="#d96b27" text-anchor="middle" font-weight="700">5.13 μm</text><text x="915" y="245" font-size="28" fill="#d96b27" text-anchor="middle" font-weight="400">Fourth-moment scale ℓ₄</text><line x1="600" y1="85" x2="600" y2="290" stroke="#dce5ec" stroke-width="1.5"/><text x="600" y="371" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">The two numbers probe different moments of the same kernel.</text></g></svg>