<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">09-profile-versus-coefficient</title><desc id="d">The R² is an actual scalar fit to the central probe-temperature profile. No profile curve is drawn because per-probe samples were not retrieved. The1micrometre coefficients are end-to-end84.4307323, central-gradient97.1900345, and400nm-to1micrometre resistance-increment106.9848084W/mK, comparedwith independentperiodic169.4505990. These definitions are different finite observables, not equivalent measurements.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="410" y="31" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">At approximately 1 μm</text><line x1="490" y1="347" x2="1170" y2="347" stroke="#dce5ec" stroke-width="1.5"/><text x="477" y="354" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="490" y1="277.52632" x2="1170" y2="277.52632" stroke="#dce5ec" stroke-width="1.5"/><text x="477" y="284.52632" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">50</text><line x1="490" y1="208.05263" x2="1170" y2="208.05263" stroke="#dce5ec" stroke-width="1.5"/><text x="477" y="215.05263" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">100</text><line x1="490" y1="138.57895" x2="1170" y2="138.57895" stroke="#dce5ec" stroke-width="1.5"/><text x="477" y="145.57895" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">150</text><line x1="490" y1="83" x2="490" y2="347" stroke="#60728a" stroke-width="1.5"/><line x1="490" y1="347" x2="1170" y2="347" stroke="#60728a" stroke-width="1.5"/><text x="830" y="423" font-size="24" fill="#10243e" text-anchor="middle" font-weight="400"></text><text x="414" y="215" font-size="23" fill="#10243e" text-anchor="middle" transform="rotate(-90 414 215)">Conductivity (W/mK)</text><rect x="536" y="229.68572" width="78" height="117.31428" fill="#0f8b8d"/><text x="575" y="215.68572" font-size="25" fill="#0f8b8d" text-anchor="middle" font-weight="700">84.4</text><text x="575" y="386" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">End-to-end</text><rect x="706" y="211.957" width="78" height="135.043" fill="#d96b27"/><text x="745" y="197.957" font-size="25" fill="#d96b27" text-anchor="middle" font-weight="700">97.2</text><text x="745" y="386" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">Central</text><text x="745" y="410" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">gradient</text><rect x="876" y="198.34742" width="78" height="148.65258" fill="#176b87"/><text x="915" y="184.34742" font-size="25" fill="#176b87" text-anchor="middle" font-weight="700">107.0</text><text x="915" y="386" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">Resistance</text><text x="915" y="410" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">increment</text><rect x="1046" y="111.55285" width="78" height="235.44715" fill="#9aaab8"/><text x="1085" y="97.55285" font-size="25" fill="#9aaab8" text-anchor="middle" font-weight="700">169.5</text><text x="1085" y="386" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">Periodic</text><text x="205" y="95" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">Central profile</text><text x="205" y="178" font-size="39" fill="#176b87" text-anchor="middle" font-weight="700">R²</text><text x="205" y="234" font-size="45" fill="#176b87" text-anchor="middle" font-weight="700">0.999991</text><text x="205" y="318" font-size="27" fill="#176b87" text-anchor="middle" font-weight="700">Almost linear</text></g></svg>