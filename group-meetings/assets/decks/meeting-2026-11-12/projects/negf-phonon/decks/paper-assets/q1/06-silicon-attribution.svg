<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Silicon current attribution</title><desc id="d">Source gap reconstruction and reported support-direct-sum geometric factors. Their product is a normalized sensitivity factor, not the0.521percent conductance error. Matrix projection is the strongest suppression in this decomposition.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="22" y="31" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">a  Source-to-current reconstruction</text><circle cx="100" cy="149" r="41" fill="white" stroke="#d96b27" stroke-width="2.5"/><text x="100" y="159" font-size="31" fill="#d96b27" text-anchor="middle" font-weight="700">ΔY</text><line x1="150" y1="149" x2="266" y2="149" stroke="#0f8b8d" stroke-width="3"/><path d="M255.76971 155.27225 L266 149 L255.76971 142.72775" fill="none" stroke="#0f8b8d" stroke-width="3"/><circle cx="320" cy="149" r="41" fill="white" stroke="#176b87" stroke-width="2.5"/><text x="320" y="159" font-size="31" fill="#176b87" text-anchor="middle" font-weight="700">Wⱼ</text><line x1="370" y1="149" x2="487" y2="149" stroke="#0f8b8d" stroke-width="3"/><path d="M476.76971 155.27225 L487 149 L476.76971 142.72775" fill="none" stroke="#0f8b8d" stroke-width="3"/><text x="291" y="254" font-size="30" fill="#0f8b8d" text-anchor="middle" font-weight="700">ΔG = 0.001459 nW/K</text><text x="291" y="316" font-size="23" fill="#60728a" text-anchor="middle" font-weight="400">Relative reconstruction error &lt; 4 × 10⁻¹³</text><text x="630" y="31" font-size="27" fill="#10243e" text-anchor="start" font-weight="700">b  Geometric suppression factors</text><line x1="705" y1="312.01686" x2="1170" y2="312.01686" stroke="#dce5ec" stroke-width="2"/><text x="693" y="319.01686" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.01</text><line x1="705" y1="205.77117" x2="1170" y2="205.77117" stroke="#dce5ec" stroke-width="2"/><text x="693" y="212.77117" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.1</text><line x1="705" y1="99.52547" x2="1170" y2="99.52547" stroke="#dce5ec" stroke-width="2"/><text x="693" y="106.52547" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">1</text><line x1="705" y1="84" x2="705" y2="344" stroke="#60728a" stroke-width="1.5"/><line x1="705" y1="344" x2="1170" y2="344" stroke="#60728a" stroke-width="1.5"/><text x="635" y="214" font-size="23" fill="#10243e" text-anchor="middle" transform="rotate(-90 635 214)">Remaining factor (log scale)</text><rect x="741.425" y="150.03694" width="82.15" height="193.96306" fill="#9aaab8"/><text x="782.5" y="138.03694" font-size="25" fill="#9aaab8" text-anchor="middle" font-weight="700">0.3346</text><text x="782.5" y="378" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">Norm</text><text x="782.5" y="406" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">overlap</text><rect x="896.425" y="286.41372" width="82.15" height="57.58628" fill="#0f8b8d"/><text x="937.5" y="274.41372" font-size="25" fill="#0f8b8d" text-anchor="middle" font-weight="700">0.0174</text><text x="937.5" y="378" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">Matrix</text><text x="937.5" y="406" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">projection</text><rect x="1051.425" y="125.72542" width="82.15" height="218.27458" fill="#d96b27"/><text x="1092.5" y="113.72542" font-size="25" fill="#d96b27" text-anchor="middle" font-weight="700">0.5668</text><text x="1092.5" y="378" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">Signed</text><text x="1092.5" y="406" font-size="22" fill="#10243e" text-anchor="middle" font-weight="400">cancellation</text></g></svg>