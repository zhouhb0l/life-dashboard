<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Observable weighting</title><desc id="d">Conceptual orthogonal decomposition in source space, not an inferred silicon vector angle. The weighting identity is standard linear response.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="300" y="43" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">Conceptual source-space geometry</text><line x1="130" y1="330" x2="575" y2="330" stroke="#176b87" stroke-width="3"/><path d="M564.76971 336.27225 L575 330 L564.76971 323.72775" fill="none" stroke="#176b87" stroke-width="3"/><text x="580" y="368" font-size="25" fill="#176b87" text-anchor="end" font-weight="700">Wⱼ direction</text><line x1="130" y1="330" x2="235" y2="102" stroke="#d96b27" stroke-width="4"/><path d="M236.4178 113.91595 L235 102 L225.02353 108.66859" fill="none" stroke="#d96b27" stroke-width="4"/><text x="245" y="99" font-size="29" fill="#d96b27" text-anchor="start" font-weight="700">ΔY</text><line x1="235" y1="102" x2="235" y2="330" stroke="#9aaab8" stroke-width="2" stroke-dasharray="6 5"/><line x1="130" y1="330" x2="235" y2="330" stroke="#0f8b8d" stroke-width="6"/><path d="M224.76971 336.27225 L235 330 L224.76971 323.72775" fill="none" stroke="#0f8b8d" stroke-width="6"/><text x="235" y="382" font-size="24" fill="#0f8b8d" text-anchor="middle" font-weight="700">Parallel part</text><text x="825" y="135" font-size="30" fill="#0f8b8d" text-anchor="middle" font-weight="700">Parallel component</text><text x="825" y="180" font-size="27" fill="#0f8b8d" text-anchor="middle" font-weight="400">Changes the current</text><text x="825" y="276" font-size="30" fill="#9aaab8" text-anchor="middle" font-weight="700">Orthogonal component</text><text x="825" y="321" font-size="26" fill="#60728a" text-anchor="middle" font-weight="400">No contribution to this current</text></g></svg>