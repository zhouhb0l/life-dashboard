<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Q3 scientific evidence</title><desc id="desc">Analytical causal-convolution interpretation. No numerical current-correlation function or continuous response trajectory is depicted. The exact projected-memory equation is distinguished from the leading reference-kernel approximation used in the predictions.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="240" y="110" font-size="29" fill="#176b87" text-anchor="middle" font-weight="700">Past energy</text><text x="240" y="149" font-size="29" fill="#176b87" text-anchor="middle" font-weight="700">and imbalance</text><text x="650" y="110" font-size="30" fill="#0f8b8d" text-anchor="middle" font-weight="700">Causal kernel</text><text x="650" y="149" font-size="30" fill="#0f8b8d" text-anchor="middle" font-weight="700">K(t − s)</text><text x="1040" y="110" font-size="29" fill="#d96b27" text-anchor="middle" font-weight="700">Change now</text><text x="1040" y="149" font-size="29" fill="#d96b27" text-anchor="middle" font-weight="700">dG/dt</text><line x1="380" y1="150" x2="480" y2="150" stroke="#176b87" stroke-width="3"/><path d="M469.46901 155.75311 L480 150 L469.46901 144.24689" fill="none" stroke="#176b87" stroke-width="3"/><line x1="820" y1="150" x2="900" y2="150" stroke="#d96b27" stroke-width="3"/><path d="M889.46901 155.75311 L900 150 L889.46901 144.24689" fill="none" stroke="#d96b27" stroke-width="3"/><line x1="125" y1="275" x2="1080" y2="275" stroke="#9aaab8" stroke-width="2"/><line x1="130" y1="275" x2="1060" y2="275" stroke="#9aaab8" stroke-width="2"/><path d="M1049.46901 280.75311 L1060 275 L1049.46901 269.24689" fill="none" stroke="#9aaab8" stroke-width="2"/><text x="130" y="317" font-size="24" fill="#60728a" text-anchor="start" font-weight="400">Earlier</text><text x="1060" y="317" font-size="24" fill="#60728a" text-anchor="end" font-weight="400">Now</text><text x="600" y="395" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">The present response depends on its earlier history.</text></g></svg>