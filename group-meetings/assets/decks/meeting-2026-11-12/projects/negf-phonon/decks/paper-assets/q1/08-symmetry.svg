<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Symmetry suppresses leading correction</title><desc id="d">Conceptual order separation from the original selected toy model: nonthermal source correction begins atp² and its current contribution atp³. This mechanism has not been asserted for silicon.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="600" y="52" font-size="29" fill="#10243e" text-anchor="middle" font-weight="700">Original symmetric toy reference</text><text x="230" y="140" font-size="27" fill="#176b87" text-anchor="middle" font-weight="700">Temperature gradient</text><line x1="390" y1="133" x2="520" y2="133" stroke="#176b87" stroke-width="3"/><path d="M509.76971 139.27225 L520 133 L509.76971 126.72775" fill="none" stroke="#176b87" stroke-width="3"/><text x="740" y="140" font-size="27" fill="#0f8b8d" text-anchor="middle" font-weight="700">Leading heat current</text><line x1="920" y1="133" x2="1085" y2="133" stroke="#0f8b8d" stroke-width="3"/><path d="M1074.76971 139.27225 L1085 133 L1074.76971 126.72775" fill="none" stroke="#0f8b8d" stroke-width="3"/><text x="230" y="281" font-size="27" fill="#d96b27" text-anchor="middle" font-weight="700">Discarded source correction</text><line x1="425" y1="274" x2="545" y2="274" stroke="#d96b27" stroke-width="3"/><path d="M534.76971 280.27225 L545 274 L534.76971 267.72775" fill="none" stroke="#d96b27" stroke-width="3"/><text x="780" y="281" font-size="28" fill="#d96b27" text-anchor="middle" font-weight="700">Higher-order current only</text><text x="600" y="375" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">Symmetry prevents a change to the leading coefficient</text></g></svg>