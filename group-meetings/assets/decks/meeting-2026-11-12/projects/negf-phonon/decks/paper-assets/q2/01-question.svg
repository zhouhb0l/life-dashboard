<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">01-question</title><desc id="d">Actual saved original-reference silicon values: periodic169.450599W/mK; central probe-temperature fit R²0.9999907 at1micrometre; end-to-end effective conductivity84.430732W/mK. These are separate observables, not three measurements of one finite-device quantity. No profile curve is reconstructed.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="200" y="57" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">Periodic coefficient</text><text x="600" y="57" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">Profile linearity</text><text x="1000" y="57" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">Device coefficient</text><text x="200" y="185" font-size="62" fill="#0f8b8d" text-anchor="middle" font-weight="700">169.45</text><text x="200" y="230" font-size="27" fill="#0f8b8d" text-anchor="middle" font-weight="400">W m⁻¹ K⁻¹</text><text x="600" y="185" font-size="57" fill="#176b87" text-anchor="middle" font-weight="700">0.999991</text><text x="600" y="230" font-size="27" fill="#176b87" text-anchor="middle" font-weight="400">R² at 1 μm</text><text x="1000" y="185" font-size="62" fill="#d96b27" text-anchor="middle" font-weight="700">84.43</text><text x="1000" y="230" font-size="27" fill="#d96b27" text-anchor="middle" font-weight="400">W m⁻¹ K⁻¹ at 1 μm</text><line x1="400" y1="90" x2="400" y2="285" stroke="#dce5ec" stroke-width="1.5"/><line x1="800" y1="90" x2="800" y2="285" stroke="#dce5ec" stroke-width="1.5"/><text x="600" y="354" font-size="29" fill="#10243e" text-anchor="middle" font-weight="700">A straight profile appears before coefficient convergence.</text></g></svg>