<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Physical evidence and open transfer test</title><desc id="d">Established evidence chain and explicit open silicon predictive-transfer test. No universal closure criterion or new silicon predictive repair is asserted.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="600" y="53" font-size="30" fill="#10243e" text-anchor="middle" font-weight="700">Evidence for observable-specific closure</text><circle cx="190" cy="167" r="52" fill="white" stroke="#176b87" stroke-width="2.5"/><text x="190" y="177" font-size="31" fill="#176b87" text-anchor="middle" font-weight="700">1</text><line x1="265" y1="167" x2="525" y2="167" stroke="#176b87" stroke-width="3"/><path d="M514.76971 173.27225 L525 167 L514.76971 160.72775" fill="none" stroke="#176b87" stroke-width="3"/><circle cx="600" cy="167" r="52" fill="white" stroke="#d96b27" stroke-width="2.5"/><text x="600" y="177" font-size="31" fill="#d96b27" text-anchor="middle" font-weight="700">2</text><line x1="675" y1="167" x2="935" y2="167" stroke="#d96b27" stroke-width="3"/><path d="M924.76971 173.27225 L935 167 L924.76971 160.72775" fill="none" stroke="#d96b27" stroke-width="3"/><circle cx="1010" cy="167" r="52" fill="white" stroke="#0f8b8d" stroke-width="2.5"/><text x="1010" y="177" font-size="31" fill="#0f8b8d" text-anchor="middle" font-weight="700">3</text><text x="190" y="273" font-size="29" fill="#176b87" text-anchor="middle" font-weight="700">Selectivity</text><text x="190" y="316" font-size="24" fill="#60728a" text-anchor="middle" font-weight="400">Silicon + toy model</text><text x="600" y="273" font-size="29" fill="#d96b27" text-anchor="middle" font-weight="700">Controlled failure</text><text x="600" y="316" font-size="24" fill="#60728a" text-anchor="middle" font-weight="400">Internal-mode mixing</text><text x="1010" y="273" font-size="29" fill="#0f8b8d" text-anchor="middle" font-weight="700">Predictive repair</text><text x="1010" y="316" font-size="24" fill="#60728a" text-anchor="middle" font-weight="400">Held-out toy tests</text><text x="600" y="397" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">Open test: transfer the prediction to a new silicon condition</text></g></svg>