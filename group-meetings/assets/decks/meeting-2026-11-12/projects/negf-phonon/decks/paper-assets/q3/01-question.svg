<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Q3 scientific evidence</title><desc id="desc">Analytical question diagram. Integrated current correlations and their time history are distinct information; numerical validation uses the stable two-field lattice, not silicon.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="600" y="52" font-size="31" fill="#10243e" text-anchor="middle" font-weight="700">Which microscopic information predicts heat relaxation?</text><text x="225" y="155" font-size="30" fill="#176b87" text-anchor="middle" font-weight="700">Integrated strength</text><text x="225" y="194" font-size="30" fill="#176b87" text-anchor="middle" font-weight="700">D = ∫ C(t) dt</text><text x="605" y="155" font-size="30" fill="#0f8b8d" text-anchor="middle" font-weight="700">Correlation history</text><text x="605" y="194" font-size="30" fill="#0f8b8d" text-anchor="middle" font-weight="700">C(t)</text><text x="1010" y="155" font-size="30" fill="#d96b27" text-anchor="middle" font-weight="700">Transient response</text><text x="1010" y="194" font-size="30" fill="#d96b27" text-anchor="middle" font-weight="700">G(q,t)</text><text x="405" y="210" font-size="43" fill="#176b87" text-anchor="middle" font-weight="700">+</text><line x1="770" y1="200" x2="840" y2="200" stroke="#d96b27" stroke-width="3"/><path d="M829.46901 205.75311 L840 200 L829.46901 194.24689" fill="none" stroke="#d96b27" stroke-width="3"/><text x="600" y="340" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">The tested question: does time history add predictive information?</text></g></svg>