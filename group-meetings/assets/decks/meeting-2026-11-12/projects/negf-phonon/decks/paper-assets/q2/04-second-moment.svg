<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">04-second-moment</title><desc id="d">Equation interpretation for a reciprocal scalar exchange network: the periodic Fourier coefficient comes from the second spatial moment of the exchange kernel. For the all-signed displacement convention mu2, kappa0=a mu2/(2A). This is independently evaluated, not fitted to contacted device data.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="205" y="60" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">Exchange kernel</text><text x="600" y="60" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">Distance weighting</text><text x="1010" y="60" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">Bulk coefficient</text><text x="205" y="186" font-size="68" fill="#0f8b8d" text-anchor="middle" font-weight="700">Kᵣ</text><line x1="285" y1="170" x2="450" y2="170" stroke="#0f8b8d" stroke-width="3"/><path d="M438 176 L450 170 L438 164" fill="none" stroke="#0f8b8d" stroke-width="3"/><text x="600" y="186" font-size="49" fill="#7055a8" text-anchor="middle" font-weight="700">Σ r² Kᵣ</text><line x1="755" y1="170" x2="890" y2="170" stroke="#d96b27" stroke-width="3"/><path d="M878 176 L890 170 L878 164" fill="none" stroke="#d96b27" stroke-width="3"/><text x="1010" y="186" font-size="68" fill="#d96b27" text-anchor="middle" font-weight="700">κ₀</text><text x="600" y="315" font-size="30" fill="#10243e" text-anchor="middle" font-weight="700">Computed in the periodic model</text><text x="600" y="370" font-size="26" fill="#60728a" text-anchor="middle" font-weight="400">No fit to the finite-length conductivity curve</text></g></svg>