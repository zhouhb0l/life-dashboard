<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">03-exchange-network</title><desc id="d">Conceptual thermal-section exchange network, not fitted silicon pairwise kernels. Auxiliary temperatures constrain integrated power. Pair conductances are computed from full Green functions, so source locality does not make transport nearest-neighbor. The retained spatial support approximation and frozen complex retarded response define the model.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="600" y="38" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">Thermal sections exchange energy through the full device</text><circle cx="155" cy="205" r="35" fill="white" stroke="#0f8b8d" stroke-width="2"/><text x="155" y="214" font-size="26" fill="#0f8b8d" text-anchor="middle" font-weight="700">T1</text><circle cx="370" cy="205" r="35" fill="white" stroke="#0f8b8d" stroke-width="2"/><text x="370" y="214" font-size="26" fill="#0f8b8d" text-anchor="middle" font-weight="700">T2</text><circle cx="600" cy="205" r="35" fill="white" stroke="#0f8b8d" stroke-width="2"/><text x="600" y="214" font-size="26" fill="#0f8b8d" text-anchor="middle" font-weight="700">T3</text><circle cx="830" cy="205" r="35" fill="white" stroke="#0f8b8d" stroke-width="2"/><text x="830" y="214" font-size="26" fill="#0f8b8d" text-anchor="middle" font-weight="700">T4</text><circle cx="1045" cy="205" r="35" fill="white" stroke="#0f8b8d" stroke-width="2"/><text x="1045" y="214" font-size="26" fill="#0f8b8d" text-anchor="middle" font-weight="700">T5</text><line x1="195" y1="205" x2="330" y2="205" stroke="#0f8b8d" stroke-width="3"/><path d="M318 211 L330 205 L318 199" fill="none" stroke="#0f8b8d" stroke-width="3"/><line x1="410" y1="205" x2="560" y2="205" stroke="#0f8b8d" stroke-width="3"/><path d="M548 211 L560 205 L548 199" fill="none" stroke="#0f8b8d" stroke-width="3"/><line x1="640" y1="205" x2="790" y2="205" stroke="#0f8b8d" stroke-width="3"/><path d="M778 211 L790 205 L778 199" fill="none" stroke="#0f8b8d" stroke-width="3"/><line x1="870" y1="205" x2="1005" y2="205" stroke="#0f8b8d" stroke-width="3"/><path d="M993 211 L1005 205 L993 199" fill="none" stroke="#0f8b8d" stroke-width="3"/><path d="M155 163 Q600 -5 1045 163" fill="none" stroke="#d96b27" stroke-width="4"/><text x="600" y="105" font-size="26" fill="#d96b27" text-anchor="middle" font-weight="700">Long-range exchange</text><path d="M370 248 Q600 350 830 248" fill="none" stroke="#7055a8" stroke-width="3"/><text x="600" y="350" font-size="25" fill="#7055a8" text-anchor="middle" font-weight="700">Beyond nearest neighbors</text><text x="600" y="408" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">One temperature per section; nonlocal propagation remains.</text></g></svg>