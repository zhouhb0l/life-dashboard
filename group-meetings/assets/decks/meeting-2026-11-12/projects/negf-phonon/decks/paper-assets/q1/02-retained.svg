<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Retained response and thermal sources</title><desc id="d">Conceptual matched-reference comparison. Complete equilibrium response is retained; local thermal source statistics simplify the nonequilibrium collision response. Full-device populations still follow Green functions.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="205" y="61" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">Retain the response</text><text x="600" y="61" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">Model the sources</text><text x="1000" y="61" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">Solve the device</text><circle cx="205" cy="190" r="62" fill="white" stroke="#176b87" stroke-width="2.5"/><text x="205" y="200" font-size="31" fill="#176b87" text-anchor="middle" font-weight="700">Σʳ</text><circle cx="600" cy="190" r="62" fill="white" stroke="#d96b27" stroke-width="2.5"/><text x="600" y="200" font-size="31" fill="#d96b27" text-anchor="middle" font-weight="700">Σ&lt;,&gt;</text><circle cx="1000" cy="190" r="62" fill="white" stroke="#0f8b8d" stroke-width="2.5"/><text x="1000" y="200" font-size="31" fill="#0f8b8d" text-anchor="middle" font-weight="700">G</text><line x1="285" y1="190" x2="510" y2="190" stroke="#176b87" stroke-width="3"/><path d="M499.76971 196.27225 L510 190 L499.76971 183.72775" fill="none" stroke="#176b87" stroke-width="3"/><line x1="680" y1="190" x2="910" y2="190" stroke="#d96b27" stroke-width="3"/><path d="M899.76971 196.27225 L910 190 L899.76971 183.72775" fill="none" stroke="#d96b27" stroke-width="3"/><text x="205" y="303" font-size="26" fill="#176b87" text-anchor="middle" font-weight="700">Shifts + damping</text><text x="600" y="303" font-size="26" fill="#d96b27" text-anchor="middle" font-weight="700">Local thermal emission</text><text x="1000" y="303" font-size="26" fill="#0f8b8d" text-anchor="middle" font-weight="700">Full propagation</text><text x="600" y="383" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">Equilibrium scattering remains in both descriptions</text></g></svg>