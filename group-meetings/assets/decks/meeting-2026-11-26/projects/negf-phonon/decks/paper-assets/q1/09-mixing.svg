<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Controlled activation</title><desc id="d">Conceptual interbranch mixing illustration. A andB represent internal vibration sectors, not atomic coordinates or an extracted two-mode Hamiltonian. No numerical dispersion or mixing curve is invented.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="600" y="46" font-size="29" fill="#10243e" text-anchor="middle" font-weight="700">Reciprocal internal mixing ε</text><circle cx="420" cy="160" r="51" fill="white" stroke="#176b87" stroke-width="2.5"/><text x="420" y="170" font-size="31" fill="#176b87" text-anchor="middle" font-weight="700">A</text><circle cx="780" cy="160" r="51" fill="white" stroke="#7055a8" stroke-width="2.5"/><text x="780" y="170" font-size="31" fill="#7055a8" text-anchor="middle" font-weight="700">B</text><line x1="480" y1="146" x2="717" y2="146" stroke="#d96b27" stroke-width="3"/><path d="M706.76971 152.27225 L717 146 L706.76971 139.72775" fill="none" stroke="#d96b27" stroke-width="3"/><line x1="718" y1="176" x2="481" y2="176" stroke="#d96b27" stroke-width="3"/><path d="M491.23029 169.72775 L481 176 L491.23029 182.27225" fill="none" stroke="#d96b27" stroke-width="3"/><text x="150" y="314" font-size="27" fill="#176b87" text-anchor="middle" font-weight="700">Gradient</text><line x1="240" y1="306" x2="400" y2="306" stroke="#176b87" stroke-width="3"/><path d="M389.76971 312.27225 L400 306 L389.76971 299.72775" fill="none" stroke="#176b87" stroke-width="3"/><text x="601" y="314" font-size="27" fill="#d96b27" text-anchor="middle" font-weight="700">Internal correlation</text><line x1="808" y1="306" x2="970" y2="306" stroke="#d96b27" stroke-width="3"/><path d="M959.76971 312.27225 L970 306 L959.76971 299.72775" fill="none" stroke="#d96b27" stroke-width="3"/><text x="1080" y="314" font-size="27" fill="#0f8b8d" text-anchor="middle" font-weight="700">Current</text><line x1="600" y1="213" x2="600" y2="264" stroke="#d96b27" stroke-width="3"/><text x="600" y="393" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">Mixing activates a route from the gradient to current</text></g></svg>