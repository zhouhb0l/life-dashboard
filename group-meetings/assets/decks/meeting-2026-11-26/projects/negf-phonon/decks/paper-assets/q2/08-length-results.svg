<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">08-length-results</title><desc id="d">All 14 qualified contacted conductances, including the1499.66256828nm extension, are shown. Earlier points are unchanged. Right panel is their exact reciprocal R=1/G inK/nW, on a linear length axis. The purple affine reference R_ref=a+bL uses centered ordinary least squares with equal weights and exactly the three longest lengths: 399.910018208,999.77504552,1499.66256828nm. The fitted intercept is 9.280889343904224K/nW and slope is 0.03025450451198425K/nW/nm. Blue-rimmed markers identify only those three fit points. The line is extended across the displayed range for comparison; no shorter point or independent bulk coefficient enters the fit. At L=1499.66256828nm, actual resistance=54.336304120733935K/nW and fitted resistance=54.65243728238538K/nW, a signed deviation of -0.578442933876866percent. This last point is included in the fit, so the deviation is not a held-out validation. An affine shape is consistent with constant-contact Fourier scaling, but a fitted straight line alone does not establish the diffusive regime or intrinsic conductivity. The nominal original4x4/601 frozen fitted-silicon input is retained for the extension, with no new SCBA/Born calculation; a matched software-runtime comparison with the older points is not independently established. The genuine earlier400nm-plus-periodic-bulk held-out prediction is retained unchanged on its separate slide.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">a  Conductance</text><line x1="95" y1="347" x2="565" y2="347" stroke="#dce5ec" stroke-width="1.5"/><text x="82" y="354" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="95" y1="269.35294" x2="565" y2="269.35294" stroke="#dce5ec" stroke-width="1