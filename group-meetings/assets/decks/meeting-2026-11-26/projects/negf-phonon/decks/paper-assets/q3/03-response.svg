<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Q3 scientific evidence</title><desc id="desc">Normalized energy-first response channels. v is branch-energy imbalance orthogonalized to energy using an independent static covariance. G_uv maps an initial population imbalance to later energy. G(0)=I; v is an internal energy imbalance, not a literal phonon-number operator.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="250" y="58" font-size="29" fill="#10243e" text-anchor="middle" font-weight="700">Initial preparation</text><text x="940" y="58" font-size="29" fill="#10243e" text-anchor="middle" font-weight="700">Later response</text><text x="250" y="150" font-size="31" fill="#176b87" text-anchor="middle" font-weight="700">Energy u</text><text x="250" y="240" font-size="31" fill="#176b87" text-anchor="middle" font-weight="700">Branch imbalance v</text><text x="940" y="150" font-size="31" fill="#0f8b8d" text-anchor="middle" font-weight="700">Energy u(t)</text><text x="940" y="240" font-size="31" fill="#0f8b8d" text-anchor="middle" font-weight="700">Imbalance v(t)</text><line x1="430" y1="142" x2="760" y2="142" stroke="#0f8b8d" stroke-width="3"/><path d="M749.46901 147.75311 L760 142 L749.46901 136.24689" fill="none" stroke="#0f8b8d" stroke-width="3"/><text x="600" y="120" font-size="30" fill="#0f8b8d" text-anchor="middle" font-weight="700">Gᵤᵤ</text><line x1="430" y1="235" x2="760" y2="235" stroke="#d96b27" stroke-width="3"/><path d="M749.46901 240.75311 L760 235 L749.46901 229.24689" fill="none" stroke="#d96b27" stroke-width="3"/><text x="600" y="280" font-size="30" fill="#d96b27" text-anchor="middle" font-weight="700">Gᵥᵥ</text><line x1="430" y1="230" x2="760" y2="151" stroke="#7055a8" stroke-width="3"/><path d="M751.0978 159.0468 L760 151 L748.41898 147.85676" fill="none" stroke="#7055a8" stroke-width="3"/><text x="615" y="220" font-size="30" fill="#7055a8" text-anchor="middle" font-weight="700">Gᵤᵥ</text><text x="600" y="390" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">Gᵤᵥ measures how internal preparation changes later energy.</text></g></svg>