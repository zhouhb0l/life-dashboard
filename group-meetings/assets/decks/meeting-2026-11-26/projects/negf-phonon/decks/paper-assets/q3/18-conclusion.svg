<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Q3 scientific evidence</title><desc id="desc">Q3 conclusion bounded to the tested stable two-field lattice and the declared reference closure. The matched-area discriminator is positive. The current evidence does not establish an autonomous Fourier window, a silicon result, exact microscopic Mori kernels, an infinite-time conductivity or a validated universal memory-crossover criterion.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="235" y="110" font-size="27" fill="#176b87" text-anchor="middle" font-weight="700">Controlled comparison</text><text x="235" y="155" font-size="27" fill="#176b87" text-anchor="middle" font-weight="700">Same integrated coefficients</text><text x="625" y="110" font-size="29" fill="#0f8b8d" text-anchor="middle" font-weight="700">6 / 6 responses</text><text x="625" y="155" font-size="29" fill="#0f8b8d" text-anchor="middle" font-weight="700">Improved by memory</text><text x="1015" y="110" font-size="27" fill="#d96b27" text-anchor="middle" font-weight="700">Open prediction</text><text x="1015" y="155" font-size="27" fill="#d96b27" text-anchor="middle" font-weight="700">When memory is negligible</text><line x1="420" y1="210" x2="465" y2="210" stroke="#0f8b8d" stroke-width="3"/><path d="M454.46901 215.75311 L465 210 L454.46901 204.24689" fill="none" stroke="#0f8b8d" stroke-width="3"/><line x1="805" y1="210" x2="850" y2="210" stroke="#d96b27" stroke-width="3"/><path d="M839.46901 215.75311 L850 210 L839.46901 204.24689" fill="none" stroke="#d96b27" stroke-width="3"/><text x="600" y="315" font-size="29" fill="#10243e" text-anchor="middle" font-weight="700">Current-correlation history carries independent predictive information.</text><text x="600" y="385" font-size="26" fill="#60728a" text-anchor="middle" font-weight="400">Demonstrated in the two-field lattice; a general crossover remains open.</text></g></svg>