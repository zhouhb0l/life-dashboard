<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">11-alpha</title><desc id="d">Left shows all 14 end-to-end effective-conductivity values, 12 actual saved interior probe-temperature-gradient coefficients and the independent169.4505990067W/mK periodic reference. Right compares 11 adjacent logarithmic interior-conductivity secants with 13 end-to-end secants, all placed at actual geometric interval midpoints. Final 999.77504552–1499.66256828nm interval: interior conductivity 97.19003450892187 to 105.43449345721454W/mK gives alpha_int 0.20081053279531721; end-to-end alpha 0.2511990765418585. Both are plotted at 1224.4693595459125nm, not as pointwise endpoint derivatives. The latest interior coefficient is a saved central-half probe-temperature-gradient scalar. Older fit windows and raw profile points are not exported; no profiles or windows are reconstructed. The interior coefficients separate the measured interior drop from interface/contact drops. The nominal original4x4/601 frozen fitted-silicon input is retained for the extension, with no new SCBA/Born calculation; a matched software-runtime comparison with the older points is not independently established. The zero guide marks length-independent conductivity. No universal ballistic interior exponent is assumed because the interior gradient can vanish. The saved interior conductivity remains length-dependent through1.5micrometres within this model.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">a  Conductivity</text><line x1="95" y1="347" x2="565" y2="347" stroke="#dce5ec" stroke-width="1.5"/><text x="82" y="354" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="95" y1="277.52632" x2="565" y2="277.52632" stroke="#dce5ec" stroke-width="1.5"/><text x="82" y="284.52632" font-size="22" fill="#