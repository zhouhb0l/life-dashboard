<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">13-gamma-moments</title><desc id="d">Actual sampled transverseGamma moment fractions: q0mu2/totalmu2 and q0mu4/totalmu4. The fourth-momentGamma fraction is about99.95percent, much larger than its second-moment fraction. The two bars are separately normalized; fractions are not additive across moment orders. These model-level results highlight strong q-sampling sensitivity rather than a converged intrinsic-material fraction.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="600" y="40" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">Long-wavelength transverse exchange is strongly amplified</text><line x1="700" y1="74" x2="726" y2="74" stroke="#7055a8" stroke-width="3"/><circle cx="713" cy="74" r="4.5" fill="#7055a8" stroke="#7055a8" stroke-width="2"/><text x="738" y="81" font-size="22" fill="#10243e" text-anchor="start" font-weight="400">Transverse Γ</text><line x1="980" y1="74" x2="1006" y2="74" stroke="#9aaab8" stroke-width="3"/><circle cx="993" cy="74" r="4.5" fill="#9aaab8" stroke="#9aaab8" stroke-width="2"/><text x="1018" y="81" font-size="22" fill="#10243e" text-anchor="start" font-weight="400">Other q</text><text x="50" y="182" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">Second moment</text><rect x="300" y="150" width="495.64006" height="54" fill="#7055a8"/><rect x="795.64006" y="150" width="354.35994" height="54" fill="#9aaab8"/><text x="315" y="186" font-size="27" fill="white" text-anchor="start" font-weight="700">58.31%</text><text x="50" y="312" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">Fourth moment</text><rect x="300" y="280" width="849.58994" height="54" fill="#7055a8"/><rect x="1149.58994" y="280" width="0.41006" height="54" fill="#9aaab8"/><text x="315" y="316" font-size="27" fill="white" text-anchor="start" font-weight="700">99.95%</text></g></svg>