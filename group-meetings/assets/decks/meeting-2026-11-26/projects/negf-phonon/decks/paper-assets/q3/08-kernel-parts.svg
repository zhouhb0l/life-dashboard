<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Q3 scientific evidence</title><desc id="desc">Analytical distinction between spatial transport-current memory and local interbranch exchange memory. The leading reference closure has K_T proportional to qhat squared and K_X proportional to epsilon squared. Exchange memory is retained in both compared predictions.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="300" y="52" font-size="29" fill="#0f8b8d" text-anchor="middle" font-weight="700">Transport memory K_T</text><text x="900" y="52" font-size="29" fill="#d96b27" text-anchor="middle" font-weight="700">Exchange memory K_X</text><circle cx="130" cy="160" r="11" fill="#0f8b8d" stroke="white" stroke-width="1.2"/><line x1="145" y1="160" x2="195" y2="160" stroke="#0f8b8d" stroke-width="2.5"/><path d="M184.46901 165.75311 L195 160 L184.46901 154.24689" fill="none" stroke="#0f8b8d" stroke-width="2.5"/><circle cx="215" cy="160" r="11" fill="#0f8b8d" stroke="white" stroke-width="1.2"/><line x1="230" y1="160" x2="280" y2="160" stroke="#0f8b8d" stroke-width="2.5"/><path d="M269.46901 165.75311 L280 160 L269.46901 154.24689" fill="none" stroke="#0f8b8d" stroke-width="2.5"/><circle cx="300" cy="160" r="11" fill="#0f8b8d" stroke="white" stroke-width="1.2"/><line x1="315" y1="160" x2="365" y2="160" stroke="#0f8b8d" stroke-width="2.5"/><path d="M354.46901 165.75311 L365 160 L354.46901 154.24689" fill="none" stroke="#0f8b8d" stroke-width="2.5"/><circle cx="385" cy="160" r="11" fill="#0f8b8d" stroke="white" stroke-width="1.2"/><line x1="400" y1="160" x2="450" y2="160" stroke="#0f8b8d" stroke-width="2.5"/><path d="M439.46901 165.75311 L450 160 L439.46901 154.24689" fill="none" stroke="#0f8b8d" stroke-width="2.5"/><circle cx="470" cy="160" r="11" fill="#0f8b8d" stroke="white" stroke-width="1.2"/><text x="300" y="240" font-size="24" fill="#0f8b8d" text-anchor="middle" font-weight="700">Current moves energy between cells</text><circle cx="835" cy="130" r="18" fill="#d96b27" stroke="white" stroke-width="1.2"/><circle cx="965" cy="210" r="18" fill="#7055a8" stroke="white" stroke-width="1.2"/><line x1="854" y1="143" x2="946" y2="196" stroke="#d96b27" stroke-width="3"/><path d="M934.00308 195.72821 L946 196 L939.74674 185.75809" fill="none" stroke="#d96b27" stroke-width="3"/><line x1="947" y1="126" x2="854" y2="200" stroke="#7055a8" stroke-width="3"/><path d="M858.65847 188.94113 L854 200 L865.8227 197.94483" fill="none" stroke="#7055a8" stroke-width="3"/><text x="900" y="270" font-size="24" fill="#d96b27" text-anchor="middle" font-weight="700">Exchange moves energy between branches</text><line x1="600" y1="35" x2="600" y2="332" stroke="#dce5ec" stroke-width="2"/><text x="600" y="390" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">Both mechanisms remain in the two-field prediction.</text></g></svg>