<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">16-independent-test</title><desc id="d">The higher moments were successfully qualified. The original signed-response and later long-wavelength computations failed their numerical qualification, so they did not validate the predicted silicon curvature or establish a wavelength-locality threshold. This diagram is a test logic, not a calculation status timeline or a reconstructed response. No new calculations are performed for the slide.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="200" y="58" font-size="28" fill="#0f8b8d" text-anchor="middle" font-weight="700">Independent moments</text><text x="600" y="58" font-size="28" fill="#0f8b8d" text-anchor="middle" font-weight="700">Frozen prediction</text><text x="1000" y="58" font-size="28" fill="#d96b27" text-anchor="middle" font-weight="700">Exact wavelength test</text><text x="200" y="180" font-size="58" fill="#0f8b8d" text-anchor="middle" font-weight="700">μ₂, μ₄</text><text x="600" y="180" font-size="31" fill="#0f8b8d" text-anchor="middle" font-weight="700">Curvature + bound</text><text x="1000" y="180" font-size="35" fill="#d96b27" text-anchor="middle" font-weight="700">Not validated</text><line x1="330" y1="163" x2="440" y2="163" stroke="#0f8b8d" stroke-width="3"/><path d="M428 169 L440 163 L428 157" fill="none" stroke="#0f8b8d" stroke-width="3"/><line x1="760" y1="163" x2="870" y2="163" stroke="#d96b27" stroke-width="3"/><path d="M858 169 L870 163 L858 157" fill="none" stroke="#d96b27" stroke-width="3"/><text x="600" y="302" font-size="28" fill="#10243e" text-anchor="middle" font-weight="700">A prediction and its independent verification remain distinct.</text><text x="600" y="374" font-size="26" fill="#60728a" text-anchor="middle" font-weight="400">No qualified silicon wavelength-response curve is claimed.</text></g></svg>