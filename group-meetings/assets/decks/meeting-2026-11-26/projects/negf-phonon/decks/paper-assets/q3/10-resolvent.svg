<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Q3 scientific evidence</title><desc id="desc">Analytical finite-cutoff resolvent identity. Equality of the zero-frequency transport kernels does not imply equality of finite-frequency response matrices. This is an identity within the shared two-field closure, not a proof of exact microscopic Mori-kernel reconstruction.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="600" y="48" font-size="30" fill="#10243e" text-anchor="middle" font-weight="700">Matching one number does not match the response function</text><text x="260" y="137" font-size="29" fill="#176b87" text-anchor="middle" font-weight="700">Zero frequency</text><text x="260" y="195" font-size="29" fill="#176b87" text-anchor="middle" font-weight="700">Same integrated kernel</text><text x="940" y="137" font-size="29" fill="#7055a8" text-anchor="middle" font-weight="700">Finite frequency</text><text x="940" y="195" font-size="29" fill="#7055a8" text-anchor="middle" font-weight="700">Different response</text><line x1="450" y1="174" x2="740" y2="174" stroke="#d96b27" stroke-width="3"/><path d="M729.46901 179.75311 L740 174 L729.46901 168.24689" fill="none" stroke="#d96b27" stroke-width="3"/><text x="300" y="310" font-size="34" fill="#176b87" text-anchor="middle" font-weight="700">ΔK(0) = 0</text><text x="900" y="310" font-size="32" fill="#7055a8" text-anchor="middle" font-weight="700">ΔK(z) need not vanish</text><text x="600" y="403" font-size="27" fill="#10243e" text-anchor="middle" font-weight="700">A slowly relaxing mode can amplify a small kernel difference.</text></g></svg>