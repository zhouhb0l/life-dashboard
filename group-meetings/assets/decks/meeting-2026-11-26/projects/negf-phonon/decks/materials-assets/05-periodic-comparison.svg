<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Periodic sheet thermal conductivity comparison</title><desc id="d">Saved periodic sheet conductivity for MoS₂ and Graphene, directly in nW/K. This two-dimensional coefficient uses equal physical sheet normalization and avoids comparing three-dimensional conductivities based on different arbitrary thickness conventions. No missing periodic value is invented. The underlying material models, coupling strengths and sampling remain those in the supplied records; this is not an independently converged experimental material ranking.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">Periodic sheet conductivity</text><line x1="95" y1="350" x2="1175" y2="350" stroke="#9aaab8" stroke-width="1.7"/><text x="83" y="357" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="95" y1="261" x2="1175" y2="261" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="268" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">200</text><line x1="95" y1="172" x2="1175" y2="172" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="179" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">400</text><line x1="95" y1="83" x2="1175" y2="83" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="90" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">600</text><line x1="365" y1="350" x2="365" y2="355" stroke="#60728a" stroke-width="1.4"/><text x="365" y="382" font-size="23" fill="#60728a" text-anchor="middle" font-weight="400">MoS₂</text><line x1="905" y1="350" x2="905" y2="355" stroke="#60728a" stroke-width="1.4"/><text x="905" y="382" font-size="23" fill="#60728a" text-anchor="middle" font-weight="400">Graphene</text><line x1="95" y1="83" x2="95" y2="350" stroke="#60728a" stroke-width="1.5"/><line x1="95" y1="350" x2="1175" y2="350" stroke="#60728a" stroke-width="1.5"/><text x="25" y="216.5" font-size="23" fill="#10243e" text-anchor="middle" transform="rotate(-90 25 216.5)">Sheet conductivity (nW/K)</text><rect x="292.5" y="292.55861" width="145" height="57.44139" fill="#0f8b8d"/><text x="365" y="275.55861" font-size="28" fill="#0f8b8d" text-anchor="middle" font-weight="700">129.1</text><rect x="832.5" y="190.03306" width="145" height="159.96694" fill="#7055a8"/><text x="905" y="173.03306" font-size="28" fill="#7055a8" text-anchor="middle" font-weight="700">359.5</text></g></svg>