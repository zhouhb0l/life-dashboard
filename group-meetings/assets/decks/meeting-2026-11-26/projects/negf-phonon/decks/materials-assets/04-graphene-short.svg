<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Graphene short-device conductance and available width-normalized comparison</title><desc id="d">1 saved qualified graphene short-device conductances are plotted at their declared samplings, with optional matched harmonic bars only if supplied. The separate panel compares the actually supplied conductance-per-width values of MoS2 and graphene, with each sampling labelled. G/width is not a three-dimensional bulk thermal conductivity. Different sampling or coupling conditions are not joined as a length trend; pending cases are not zero data.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">a  Graphene short device</text><line x1="95" y1="347" x2="565" y2="347" stroke="#9aaab8" stroke-width="1.7"/><text x="83" y="354" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="95" y1="285.25" x2="565" y2="285.25" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="292.25" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.2</text><line x1="95" y1="223.5" x2="565" y2="223.5" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="230.5" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.4</text><line x1="95" y1="161.75" x2="565" y2="161.75" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="168.75" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.6</text><line x1="95" y1="100" x2="565" y2="100" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="107" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.8</text><line x1="330" y1="347" x2="330" y2="352" stroke="#60728a" stroke-width="1.4"/><text x="330" y="379" font-size="23" fill="#60728a" text-anchor="middle" font-weight="400">4 × 1</text><line x1="95" y1="100" x2="95" y2="347" stroke="#60