<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">MoS2 conductance and resistance versus interacting length</title><desc id="d">10 saved qualified MoS2 thermal-closure conductances and their exact reciprocals R=1/G. Left: pW/K versus logarithmic active length; right: K/nW versus LINEAR active length. All native matched harmonic values are retained individually, plus the distinct short direct-SCBA point. The dashed Fourier-form reference is an unweighted ordinary least-squares affine fit R_F(L)=a+bL using ONLY the three longest qualified finite lengths: 199.84869689876, 400.24642867911, 999.79251937539 nm. Its intercept is 13.990703517828127 K/nW and slope is 0.04137364898451992 K/nW/nm. No shorter point, independent periodic conductivity, or experimental value determines this line. The fitted line is extended to shorter lengths to display deviations; it is not an independently predicted asymptote. Evaluated samples are shown without horizontal jitter. Straight segments connecting samples only guide the eye. Finite-range linearity alone is not proof of an asymptotic diffusive regime.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">a  Conductance</text><line x1="95" y1="350" x2="565" y2="350" stroke="#9aaab8" stroke-width="1.7"/><text x="83" y="357" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="95" y1="230" x2="565" y2="230" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="237" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">100</text><line x1="95" y1="110" x2="565" y2="110" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="117" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">200</text><line x1="147.7207" y1="350" x2="147.7207" y2="355" stroke="#60728a" stroke-width="1.4"/><text x="147.7207" y="3