<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">MoS2 interior and end-to-end conductivity with interval scaling exponents</title><desc id="d">10 saved end-to-end conductivities kappa=GL/(Wt) and 9 interior conductivities kappa=-J/[Wt(dT/dx)_interior]. Interior gradients use an unweighted fit over the central 50% of the active-cell interval, excluding contact entries; the one-layer case has no gradient and is omitted. The five-layer, three-position interior fit is exploratory. Adjacent logarithmic secants are placed at geometric length midpoints: 9 end-to-end intervals and 8 interior intervals. Fixed thickness cancels from each alpha ratio. The final interior alpha is 0.2985906502040253; the 60% and 80% window checks are deterministic sensitivity checks, not statistical error bars. The final interval compares separately generated numerical runtimes and is not yet a controlled length-only comparison. These are interval averages, not pointwise derivatives at 1 micrometre. The independently calculated periodic same-model coefficient is retained separately. Alpha=0 marks length-independent conductivity; no ballistic alpha=1 guide is applied to the interior-gradient definition. No fitted total-resistance intercept is subtracted. No smoothing, extrapolation, fitted plateau or new transport calculation is used.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">a  MoS₂ conductivity</text><line x1="95" y1="350" x2="575" y2="350" stroke="#9aaab8" stroke-width="1.7"/><text x="83" y="357" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="95" y1="270" x2="575" y2="270" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="277" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">100</text><line x1="95" y1="190" x2="575" y2="190" stroke="#dce5