<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">09-long-length</title><desc id="desc">All 14 saved Thermal closure conductance points are preserved and reciprocated to R=1/G. Conductance uses logarithmic length and resistance uses linear length. The affine Fourier-form reference R_F(L)=a+bL is fitted by unweighted least squares in linear R versus linear L using only the three longest lengths: 399.910018208, 999.77504552, 1499.66256828 nm. Earlier points do not contribute to the fit. Fitted slope=0.03025450451198426 K/nW/nm and intercept=9.280889343904217 K/nW. The intercept is a fit parameter, not a separately measured contact resistance. At 1499.66256828 nm, R=54.33630412073394 K/nW versus fitted 54.65243728238538 K/nW, a signed deviation of -0.5784429338768549 percent. This empirical fit does not establish a diffusive regime or an independent bulk prediction. The series includes the qualified1.5micrometre result. Earlier calculated points and the separate historical held-out test and periodic reference are preserved.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="27" fill="#10243e" text-anchor="start" font-weight="700">a  Conductance</text><line x1="95" y1="347" x2="575" y2="347" stroke="#dce5ec" stroke-width="1.4"/><text x="83" y="354" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="95" y1="277.29411764705884" x2="575" y2="277.29411764705884" stroke="#dce5ec" stroke-width="1.4"/><text x="83" y="284.29411764705884" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">100</text><line x1="95" y1="207.58823529411765" x2="575" y2="207.58823529411765" stroke="#dce5ec" stroke-width="1.4"/><text x="83" y="214.58823529411765" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">200</text><line x1="95" y1="137.88235294117646" x2="575" y2="137.88235294117646" str