<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">12 seebeck300</title><desc id="desc">Saved rounded300K Seebeck values in microvolts perkelvin: parent(+14.4,−5.9,+5.7) and q2(+7.2,−17.1,−8.7) along lattice a,b,c. The c-direction response changes sign. Here c is the lattice-vector transport direction, equivalent to the deck z_tr parallel c convention; it is not the Cartesian normal to the monoclinic(001) face. Sign reversal indicates an altered energy asymmetry of transport, not proof that the entire multiband material changes carrier type. Values come from the fixed-Hamiltonian ideal ballistic model, not an observed transition.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">Directional thermopower · 300 K</text><line x1="95" y1="337.381" x2="1170" y2="337.381" stroke="#dce5ec" stroke-width="1.2"/><text x="82" y="344.381" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">-20</text><line x1="95" y1="274.2857" x2="1170" y2="274.2857" stroke="#dce5ec" stroke-width="1.2"/><text x="82" y="281.2857" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">-10</text><line x1="95" y1="211.1905" x2="1170" y2="211.1905" stroke="#9aaab8" stroke-width="2"/><text x="82" y="218.1905" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="95" y1="148.0952" x2="1170" y2="148.0952" stroke="#dce5ec" stroke-width="1.2"/><text x="82" y="155.0952" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">10</text><line x1="95" y1="85" x2="1170" y2="85" stroke="#dce5ec" stroke-width="1.2"/><text x="82" y="92" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">20</text><line x1="296.5625" y1="350" x2="296.5625" y2="356" stroke="#60728a" stroke-width="1.5"/><text x="296.5625" y="382" font-size="23" fill="#6072