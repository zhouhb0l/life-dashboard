<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">rev-dos-contrast</title><desc id="d">Actual saved Fermi-level DOS for total and selected orbital groups in parent andq2, alongside raw native meanNoSpin propagating channel counts alonga andb. No parent-normalization is used. DOS raw EF pairs are taken directly from the201point full spectra. Channels are1.4444444444444444to0.8888888888888888 alonga and7.222222222222221to2 alongb at the exact saved zero-relative-energy sample. Higher DOS together with fewer propagating channels supports the comparative interpretation of more localized electronic states inq2. This does not uniquely identify a microscopic localization mechanism. Both source types are coarse saved calculations and these values are not bulk conductivity.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="25" y="32" font-size="27" fill="#10243e" text-anchor="start" font-weight="700">a  DOS at the Fermi level</text><rect x="500" y="18" width="24" height="15" fill="#9aaab8"/><text x="535" y="33" font-size="24" fill="#10243e" text-anchor="start" font-weight="400">Parent</text><rect x="685" y="18" width="24" height="15" fill="#0f8b8d"/><text x="720" y="33" font-size="24" fill="#10243e" text-anchor="start" font-weight="400">q₂</text><text x="825" y="32" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">b  Propagating channels</text><line x1="85" y1="340" x2="750" y2="340" stroke="#dce5ec" stroke-width="1.3"/><text x="73" y="347" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="85" y1="230.9090909090909" x2="750" y2="230.9090909090909" stroke="#dce5ec" stroke-width="1.3"/><text x="73" y="237.9090909090909" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">100</text><line x1="85" y1="121.81818181818181" x2="750" y2="121.81818181818181" stroke="#dce5ec" stroke-width="1.3"/><text x="73