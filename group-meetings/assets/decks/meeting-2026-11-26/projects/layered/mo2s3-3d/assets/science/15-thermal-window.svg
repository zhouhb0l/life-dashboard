<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">15 thermal window</title><desc id="desc">All nine actual saved direction/temperature comparison rows are used. Left: q2/parent thermally integrated ballistic-conductance ratios for a,b,c at100,200,300K. Right: the actual c-direction Seebeck values for both phases at the same three temperatures. Parent and q2 have opposite c-Seebeck signs at200and300K; both are negative at100K. Lines guide between the three evaluated temperatures. Temperature varies the Fermi integration window on saved300K bulk Hamiltonians with fixed chemical potentials; these curves do not calculate temperature-dependent structural changes, scattering rates, a CDW transition temperature, or bulk conductivity.</desc><rect width="1200" height="430" fill="white"/><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="31" font-size="26" fill="#10243e" text-anchor="start" font-weight="700">a  Conductance remains suppressed</text><line x1="95" y1="350" x2="565" y2="350" stroke="#9aaab8" stroke-width="2"/><text x="83" y="357" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0</text><line x1="95" y1="301.2" x2="565" y2="301.2" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="308.2" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.2</text><line x1="95" y1="252.4" x2="565" y2="252.4" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="259.4" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.4</text><line x1="95" y1="203.6" x2="565" y2="203.6" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="210.6" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.6</text><line x1="95" y1="154.8" x2="565" y2="154.8" stroke="#dce5ec" stroke-width="1.2"/><text x="83" y="161.8" font-size="22" fill="#60728a" text-anchor="end" font-weight="400">0.8</text><line x1="95" y1="106" x2="565" y2="106" stroke="#dce5ec" stroke-width="1